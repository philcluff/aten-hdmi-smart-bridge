esphome:
  name: hdmi-switch
  friendly_name: HDMI Switch
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_leds

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: current_input
    type: int
    initial_value: "0"
  - id: last_reply_ms
    type: uint32_t
    initial_value: "0"
  - id: switch_alive
    type: bool
    initial_value: "false"
  - id: last_command_ms
    type: uint32_t
    initial_value: "0"
  - id: last_published_line
    type: std::string
    initial_value: '""'

uart:
  id: aten
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\r\n"
    sequence:
      - lambda: |-
          std::string chunk(bytes.begin(), bytes.end());
          size_t start = 0;
          while (start < chunk.size()) {
            size_t end = chunk.find('\n', start);
            std::string line = chunk.substr(start, end == std::string::npos ? std::string::npos : end - start);
            start = end == std::string::npos ? chunk.size() : end + 1;
            while (!line.empty() && (line.back() == '\r' || line.back() == '\n')) {
              line.pop_back();
            }
            if (line.empty()) {
              continue;
            }
            id(last_reply_ms) = millis();
            bool is_input = line.rfind("Input: port", 0) == 0;
            bool is_ack = line.rfind("sw i0", 0) == 0 && line.find("Command OK") != std::string::npos;
            bool is_reject = line.find("Command incorrect") != std::string::npos;
            if (is_input) {
              id(current_input) = line.back() - '0';
            } else if (is_ack) {
              id(current_input) = line[5] - '0';
            }
            if ((is_input || is_ack || is_reject) && line != id(last_published_line)) {
              id(last_published_line) = line;
              id(last_response).publish_state(line);
            }
          }
          id(refresh_leds).execute();

switch:
  - platform: template
    name: "Input 1"
    id: hdmi_input_1
    icon: mdi:numeric-1-box
    lambda: return id(current_input) == 1;
    turn_on_action:
      - script.execute:
          id: select_input
          input: 1
  - platform: template
    name: "Input 2"
    id: hdmi_input_2
    icon: mdi:numeric-2-box
    lambda: return id(current_input) == 2;
    turn_on_action:
      - script.execute:
          id: select_input
          input: 2
  - platform: template
    name: "Input 3"
    id: hdmi_input_3
    icon: mdi:numeric-3-box
    lambda: return id(current_input) == 3;
    turn_on_action:
      - script.execute:
          id: select_input
          input: 3
  - platform: template
    name: "Input 4"
    id: hdmi_input_4
    icon: mdi:numeric-4-box
    lambda: return id(current_input) == 4;
    turn_on_action:
      - script.execute:
          id: select_input
          input: 4

button:
  - platform: restart
    name: "Restart"

binary_sensor:
  - platform: template
    name: "Switch Responding"
    id: switch_responding
    device_class: connectivity
    lambda: return id(switch_alive);

text_sensor:
  - platform: template
    id: last_response
    name: "Last Switch Response"

output:
  - platform: ledc
    pin: GPIO25
    id: led_green_out
    frequency: 2000Hz
  - platform: ledc
    pin: GPIO26
    id: led_red_out
    frequency: 2000Hz

# Brightness balanced on the bench: green at full through 220 R, red at half through 330 R.
light:
  - platform: monochromatic
    id: led_green
    output: led_green_out
    internal: true
    default_transition_length: 0s
  - platform: monochromatic
    id: led_red
    output: led_red_out
    internal: true
    default_transition_length: 0s

interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: return millis() - id(last_command_ms) > 3000;
          then:
            - uart.write: "read\r\n"
  - interval: 500ms
    then:
      - lambda: |-
          id(switch_alive) = id(last_reply_ms) != 0 && (millis() - id(last_reply_ms)) < 90000;
      - script.execute: refresh_leds

# Green: steady when Home Assistant is connected, blinking when powered but not connected.
# Red: on when the switch has not replied to anything for 90 s.
# Sends a switch command, holds the read poll off for 3 s so the two can't collide,
# and resends once if the switch hasn't acknowledged within 600 ms.
script:
  - id: select_input
    mode: restart
    parameters:
      input: int
    then:
      - lambda: |-
          id(last_command_ms) = millis();
          char cmd[10];
          snprintf(cmd, sizeof(cmd), "sw i%02d\r\n", input);
          id(aten).write_str(cmd);
      - delay: 600ms
      - if:
          condition:
            lambda: return id(current_input) != input;
          then:
            - lambda: |-
                ESP_LOGW("hdmi", "input %d not acknowledged, resending", input);
                id(last_command_ms) = millis();
                char cmd[10];
                snprintf(cmd, sizeof(cmd), "sw i%02d\r\n", input);
                id(aten).write_str(cmd);
  - id: refresh_leds
    mode: restart
    then:
      - if:
          condition:
            api.connected:
          then:
            - light.turn_on:
                id: led_green
                brightness: 100%
          else:
            - light.toggle: led_green
      - if:
          condition:
            lambda: return id(switch_alive);
          then:
            - light.turn_off: led_red
          else:
            - light.turn_on:
                id: led_red
                brightness: 50%
